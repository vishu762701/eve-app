def resolveTelegramCredential(String primaryKey, String fallbackKey) {
    if (project.hasProperty(primaryKey)) {
        def v = project.property(primaryKey)
        if (v != null && !v.toString().trim().isEmpty()) return v.toString().trim()
    }
    if (project.hasProperty(fallbackKey)) {
        def v = project.property(fallbackKey)
        if (v != null && !v.toString().trim().isEmpty()) return v.toString().trim()
    }
    def envPrimary = System.getenv(primaryKey)
    if (envPrimary != null && !envPrimary.trim().isEmpty()) return envPrimary.trim()
    def envFallback = System.getenv(fallbackKey)
    if (envFallback != null && !envFallback.trim().isEmpty()) return envFallback.trim()
    def localPrimary = getProps(primaryKey)
    if (localPrimary != null && !localPrimary.toString().trim().isEmpty()) return localPrimary.toString().trim()
    def localFallback = getProps(fallbackKey)
    if (localFallback != null && !localFallback.toString().trim().isEmpty()) return localFallback.toString().trim()
    return ""
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
        def isEndUserRelease = project.gradle.startParameter.taskNames.find {
            it.contains("Release") || it.contains("Standalone") || it.contains("bundle")
        }
        if (isEndUserRelease) {
            def rawAppId = resolveTelegramCredential("EVE_TELEGRAM_APP_ID", "TELEGRAM_APP_ID")
            def rawAppHash = resolveTelegramCredential("EVE_TELEGRAM_APP_HASH", "TELEGRAM_APP_HASH")
            def parsedId = 0
            try {
                if (rawAppId) parsedId = Integer.parseInt(rawAppId.trim())
            } catch (NumberFormatException ignored) {
                parsedId = 0
            }
            if (parsedId <= 0 || parsedId == 4 || !rawAppHash || rawAppHash == "014b35b6184100b085b0d0572f9b5103") {
                throw new GradleException("BLOCKED_CREDENTIALS: Configure owner-provided EVE_TELEGRAM_APP_ID and EVE_TELEGRAM_APP_HASH in android/local.properties, Gradle properties, or environment variables before building release/standalone.")
            }
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility
