android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"


    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    // IWidgetEngine: the widget engine's isolated process (WidgetEngineService).
    buildFeatures {
        aidl true
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        def rawAppId = resolveTelegramCredential("EVE_TELEGRAM_APP_ID", "TELEGRAM_APP_ID")
        def rawAppHash = resolveTelegramCredential("EVE_TELEGRAM_APP_HASH", "TELEGRAM_APP_HASH")
        def parsedAppId = 0
        try {
            if (rawAppId != null && !rawAppId.trim().isEmpty()) {
                parsedAppId = Integer.parseInt(rawAppId.trim())
            }
        } catch (NumberFormatException ignored) {
            parsedAppId = 0
        }
        def cleanAppHash = rawAppHash != null ? rawAppHash.trim() : ""
        def hasCustomTelegramApiCredentials = parsedAppId > 0 && parsedAppId != 4 && !cleanAppHash.isEmpty() && !cleanAppHash.equals("014b35b6184100b085b0d0572f9b5103")
        def escapedAppHash = hasCustomTelegramApiCredentials ? cleanAppHash.replace("\\", "\\\\").replace("\"", "\\\"") : ""
        buildConfigField "int", "TELEGRAM_APP_ID", hasCustomTelegramApiCredentials ? "${parsedAppId}" : "0"
        buildConfigField "String", "TELEGRAM_APP_HASH", "\"${escapedAppHash}\""
        buildConfigField "boolean", "HAS_CUSTOM_TELEGRAM_API_CREDENTIALS", "${hasCustomTelegramApiCredentials}"

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49', 'twidget'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
