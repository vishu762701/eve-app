name: Build Eve APK

# Authoritative Android build targets android/ (:TMessagesProj_App:assembleAfatDebug).
# Backend, Firebase rules, and port-integrity gates run on every push and manual dispatch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_verified_apk:
        description: 'Upload debug APK only with explicit owner publication approval'
        type: boolean
        required: false
        default: false

# New pushes supersede previous quick builds. Manual FULL runs are never cancelled.
concurrency:
  group: eve-build-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  telegram-port-integrity:
    name: Telegram Port Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EVE repository
        uses: actions/checkout@v4
        with:
          path: eve-repo

      - name: Checkout pinned Telegram repository
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: 21f7d109da6ab3506c9e9577f98c6a38771ab335
          path: telegram-upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run verifier unit tests
        run: |
          python3 -m unittest discover -s eve-repo/.github/scripts -p "test_*.py"

      - name: Run Telegram port integrity verifier
        run: |
          python3 eve-repo/.github/scripts/verify_telegram_port.py --repo-root eve-repo --upstream-root telegram-upstream

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-package-lock
      - name: Check backend types and tests
        working-directory: backend
        run: |
          npm run build
          npm test

  firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate optional Firebase Functions and question parser
        run: |
          npm run build --prefix functions
          npm test --prefix functions
      - name: Set up Java for Firebase rule emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Worker-only Firebase administrative authority
        working-directory: firebase-tests
        run: |
          npm install --no-package-lock
          npm test

  build:
    name: Build New Android App (android/)
    needs: [telegram-port-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_sha256: ${{ steps.apk_digest.outputs.sha256 }}
    steps:
      - name: Checkout EVE repository
        uses: actions/checkout@v4

      - name: Initialize git submodules at exact pinned commits
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
          git submodule status --recursive
          if git submodule status --recursive | grep -qE '^[-+U]'; then
            echo "::error::Uninitialized, mismatched, or conflicted git submodule detected."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native build tools (nasm)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Check google-services.json
        run: |
          test -s android/TMessagesProj/google-services.json
          test -s android/TMessagesProj_App/google-services.json

      - name: Accept Android SDK licenses and install Platform 36, NDK, and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pinned native renderer security and C API tests (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cargo +1.99.1 test --locked --release --lib --features c-api --manifest-path app/src/main/cpp/vendor/tlottie/Cargo.toml -- --test-threads=1

      - name: Verify Gradle tasks in android/
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_App:tasks --all --console=plain > ../ci-android-tasks.log
          grep -F "assembleAfatDebug" ../ci-android-tasks.log

      - name: Build authoritative debug APK (:TMessagesProj_App:assembleAfatDebug)
        working-directory: android
        env:
          EVE_TELEGRAM_APP_ID: ${{ secrets.EVE_TELEGRAM_APP_ID }}
          EVE_TELEGRAM_APP_HASH: ${{ secrets.EVE_TELEGRAM_APP_HASH }}
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --console=plain 2>&1 | tee ../ci-android-build.log

      - name: Run Android project JVM unit tests (:TMessagesProj:testDebugUnitTest)
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee ../ci-android-unit.log

      - name: Verify APK output and package ID (com.eve.app)
        id: apk_digest
        run: |
          set -euo pipefail
          APK_PATH="android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            find android/TMessagesProj_App/build/outputs -type f || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_PATH" > apk-badging.txt
          head -n 20 apk-badging.txt
          if ! grep -Fq "package: name='com.eve.app'" apk-badging.txt; then
            echo "::error::Built APK package ID is not com.eve.app"
            exit 1
          fi
          echo "sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload build failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_id }}
          path: |
            ci-android-tasks.log
            ci-android-build.log
            ci-android-unit.log
            apk-badging.txt
            android/TMessagesProj/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload authoritative debug APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: Eve-debug-apk
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save candidate APK for gated publication
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/save@v4
        with:
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          key: eve-apk-${{ github.run_id }}-${{ github.sha }}

  publish-apk:
    name: Publish verified debug APK
    needs: [build, backend, firebase-functions]
    if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_verified_apk == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore exact candidate APK without recompilation
        uses: actions/cache/restore@v4
        with:
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          key: eve-apk-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Verify same APK checksum before publication
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          echo "$EXPECTED_SHA256  android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk" | sha256sum --check --status
          echo "Publishing exact APK compiled for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Eve-debug-apk
          path: android/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
